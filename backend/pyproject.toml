[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.110.0",
    "google-generativeai==0.5.4",
    "groq==0.9.0",
    "httpx==0.27.0",
    "numpy==1.26.4",
    "pgvector==0.3.5",
    "psycopg[binary]==3.1.18",
    "pydantic==2.6.4",
    "pydantic-settings==2.1.0",
    "pymupdf==1.23.26",
    "python-dotenv==1.0.1",
    "python-multipart==0.0.9",
    "scikit-learn==1.4.2",
    "slowapi==0.1.9",
    "sqlalchemy==2.0.29",
    "sse-starlette==2.1.0",
    "uvicorn[standard]==0.29.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.7",
    "pytest-cov==5.0.0",
    "pytest-timeout==2.3.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# No single test should take this long; a hang in the SSE paths must fail loudly
# rather than block the run forever.
timeout = 60
markers = [
    "unit: pure logic, no I/O",
    "integration: crosses a component boundary (API, DB, ingest)",
    "e2e: full user-visible flow",
    "realtime: SSE streaming semantics",
    "performance: latency and event-loop budgets",
    "slow: excluded from the default fast run",
]
filterwarnings = [
    "ignore::DeprecationWarning:httpx.*",
    "ignore::DeprecationWarning:pydantic.*",
]
