services:
  - type: web
    name: aura-api
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Bind the port Render injects rather than a hardcoded one.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    # Without this Render cannot tell a booted-but-broken instance from a healthy
    # one. /ready returns 503 when the database or LLM is unreachable.
    healthCheckPath: /ready
    envVars:
      - key: DATABASE_URL
        sync: false  # paste Supabase URL in Render dashboard
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      # Required for retrieval even when LLM_PROVIDER=groq: embeddings are always
      # generated by Gemini, so without this key ingest and search silently fall
      # back to TF-IDF and pgvector is never used.
      - key: GEMINI_API_KEY
        sync: false
      - key: RETRIEVAL_THRESHOLD
        value: 0.85
      - key: CORS_ORIGINS
        value: https://your-vercel-app.vercel.app
      # Leave false for a public demo; setting it true requires API_KEYS below and
      # the frontend does not yet send a key.
      - key: ENABLE_AUTH
        value: false
      - key: API_KEYS
        sync: false
