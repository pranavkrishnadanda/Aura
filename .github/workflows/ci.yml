name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    services:
      # Real Postgres with pgvector, so the DB paths are exercised for real rather
      # than only through the in-memory fallback.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aura
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Exercises the postgresql:// -> postgresql+psycopg:// normalisation that a
      # missing psycopg2 used to silently turn into in-memory mode.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aura
      LLM_PROVIDER: mock
      CORS_ORIGINS: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        working-directory: backend
        run: uv sync --group dev
      - name: Verify the DB is actually connected
        working-directory: backend
        run: |
          # Guards the headline regression: if the driver or URL is wrong the app
          # falls back to in-memory and every other test still passes.
          uv run python -c "
          from app.db import is_db_available, db_error
          assert is_db_available(), f'DB not connected: {db_error()}'
          print('postgres connected')
          "
      - name: Test
        working-directory: backend
        env:
          # Use coverage's sys.monitoring backend (Python 3.12+) instead of the
          # legacy settrace tracer. The old tracer fires per line of every module,
          # which made multipart parsing of the oversized-upload test's body take
          # 70s instead of 1s -- it timed out only in this job, because it is the
          # only one running under --cov.
          COVERAGE_CORE: sysmon
        # --durations surfaces slow tests, so a CI-only timeout leaves evidence.
        run: uv run pytest -q --cov=app --cov-report=term-missing --durations=10

  backend-no-db:
    name: Backend (in-memory fallback)
    runs-on: ubuntu-latest
    env:
      # No database at all: proves the fallback degrades honestly rather than
      # pretending to be healthy.
      DATABASE_URL: postgresql://nobody@127.0.0.1:1/nothing
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        working-directory: backend
        run: uv sync --group dev
      - name: Health must report degraded, readiness must fail closed
        working-directory: backend
        run: |
          uv run python -c "
          from fastapi.testclient import TestClient
          from app.main import app
          c = TestClient(app)
          h = c.get('/health').json()
          assert h['status'] == 'degraded', h
          assert h['storage_mode'].startswith('in-memory'), h
          assert h['db_error'], 'degraded health must name a cause'
          assert c.get('/ready').status_code == 503
          print('degraded mode reported correctly')
          "
      - name: Test
        working-directory: backend
        run: uv run pytest -q

  frontend:
    name: Frontend (vitest + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Unit and component tests
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Install browsers
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run
        working-directory: frontend
        run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
